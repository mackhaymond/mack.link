name: CI and Deploy

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Wrangler 4.x requires Node >=22; the wrangler-action auto-installs the
  # latest wrangler@4 and refuses to run on older Node, so this must stay
  # in lockstep with WRANGLER_VERSION.
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4'

jobs:
  validate:
    name: Validate (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # S1: Build runs before Test because vitest-pool-workers loads
        # worker/wrangler.jsonc, which declares an `assets` binding pointing
        # at ../admin/dist. Miniflare expects that directory to exist when
        # the worker boots; running the admin build first guarantees it.
        # Vite reads test-only API base / OAuth client id from .env.local
        # (gitignored) so VITE_GITHUB_CLIENT_ID isn't undefined at build time.
        run: |
          cat > admin/.env.local << EOL
          VITE_API_BASE=http://localhost:8787
          VITE_WORKER_DOMAIN=localhost:8787
          VITE_GITHUB_CLIENT_ID=test_client_id
          EOL
          npm run build

      - name: Test
        run: npm test

  preview:
    # S3: PR preview deploys. Every pull request that passes validate gets
    # auto-deployed to the staging Worker (env.staging in wrangler.jsonc)
    # so deploy-time landmines (wrangler config drift, secret rot, D1
    # migration gaps) surface at PR time instead of post-merge.
    #
    # Gracefully skips with a warning if the staging D1 hasn't been
    # created yet - the user runs `wrangler d1 create mack-link-staging`
    # once, pastes the database_id into wrangler.jsonc, and from then on
    # every PR auto-deploys. The skip preserves a green CI run so the
    # PR is still mergeable while staging is being bootstrapped.
    name: Deploy preview (staging)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    environment:
      name: staging
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check staging D1 is configured
        id: check
        shell: bash
        run: |
          if grep -q "REPLACE_ME_AFTER_wrangler_d1_create" worker/wrangler.jsonc; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Staging D1 not yet created. Run \`wrangler d1 create mack-link-staging\` and paste the database_id into worker/wrangler.jsonc env.staging.d1_databases[0].database_id to enable PR preview deploys."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check staging subdomain secret
        id: check_subdomain
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          CF_WORKERS_SUBDOMAIN: ${{ secrets.CF_WORKERS_SUBDOMAIN }}
        run: |
          if [ -z "$CF_WORKERS_SUBDOMAIN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CF_WORKERS_SUBDOMAIN secret not set. See docs/GITHUB_SECRETS.md to configure. Skipping preview deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build admin for staging
        if: steps.check.outputs.skip != 'true' && steps.check_subdomain.outputs.skip != 'true'
        env:
          CF_WORKERS_SUBDOMAIN: ${{ secrets.CF_WORKERS_SUBDOMAIN }}
        run: |
          cat > admin/.env.production << EOL
          VITE_API_BASE=https://worker-staging.${CF_WORKERS_SUBDOMAIN}.workers.dev
          VITE_WORKER_DOMAIN=worker-staging.${CF_WORKERS_SUBDOMAIN}.workers.dev
          VITE_GITHUB_CLIENT_ID=staging_unused
          VITE_AUTH_DISABLED=true
          EOL
          npm run build

      - name: Apply staging D1 migrations
        if: steps.check.outputs.skip != 'true' && steps.check_subdomain.outputs.skip != 'true'
        # S3: migrate.mjs reads D1_DATABASE_NAME (default mack-link) so the
        # exact same runner that owns prod migrations also owns staging.
        env:
          D1_DATABASE_NAME: mack-link-staging
          AUTHORIZED_USER: mackhaymond
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm -w worker run db:apply

      - name: Deploy to staging
        if: steps.check.outputs.skip != 'true' && steps.check_subdomain.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env staging
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
        env:
          # Staging runs in AUTH_DISABLED=true mode (see env.staging.vars in
          # wrangler.jsonc) so a real OAuth client is not required. JWT_SECRET
          # must still be present for cookie signing; reuse the prod secret
          # rather than minting a separate staging one to keep secret sprawl low.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Smoke test staging
        if: steps.check.outputs.skip != 'true' && steps.check_subdomain.outputs.skip != 'true'
        env:
          CF_WORKERS_SUBDOMAIN: ${{ secrets.CF_WORKERS_SUBDOMAIN }}
        shell: bash
        run: |
          URL="https://worker-staging.${CF_WORKERS_SUBDOMAIN}.workers.dev"
          # Wait for the new deployment to propagate to all edges. 10s is
          # the empirical lower bound; previous bare deploys saw 503s
          # from cold-routing edges if smoke-tested immediately.
          sleep 10
          echo "Smoke testing $URL"
          curl -fsS -o /dev/null "$URL/"
          curl -fsS -o /dev/null "$URL/admin"

      - name: Comment preview URL on PR
        if: steps.check.outputs.skip != 'true' && steps.check_subdomain.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          CF_WORKERS_SUBDOMAIN: ${{ secrets.CF_WORKERS_SUBDOMAIN }}
        with:
          script: |
            const url = `https://worker-staging.${process.env.CF_WORKERS_SUBDOMAIN}.workers.dev`;
            const marker = '<!-- preview-deploy-comment -->';
            const body = `${marker}\n🚀 **Preview deployed**: ${url}\n\n- Admin: ${url}/admin\n- Auth: bypassed (AUTH_DISABLED=true on staging)\n\nDeployed from \`${context.payload.pull_request.head.sha.substring(0, 7)}\`.`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://link.mackhaymond.co
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin SPA for production
        # Sprint 2a (A5): VITE_GITHUB_CLIENT_ID is no longer read by the
        # admin (no in-app OAuth) but Vite treats import.meta.env values
        # as build-time constants - emit a stable dummy until the next
        # admin cleanup pass to keep the build deterministic.
        run: |
          cat > admin/.env.production << EOL
          VITE_API_BASE=https://link.mackhaymond.co
          VITE_WORKER_DOMAIN=link.mackhaymond.co
          VITE_GITHUB_CLIENT_ID=unused-post-access-migration
          EOL
          npm run build

      # D1 schema changes are applied out-of-band: run `npm run db:apply:prod`
      # locally before merging. The repo uses a custom JS runner (handles
      # SQLite ALTER idempotency + a bespoke `migrations` table) instead of
      # wrangler's built-in d1 migrations, so a `wrangler d1 migrations`
      # step here would fail (different folder layout, different tracking
      # table) and block deploys for no real safety win.

      - name: Deploy with Wrangler
        # Sprint 2a (A5): the prior env: block injected JWT_SECRET +
        # GITHUB_CLIENT_ID + GITHUB_CLIENT_SECRET on this step. None of
        # those are read by the Worker anymore (Access handles auth at
        # the edge; Worker only needs TEAM_DOMAIN + POLICY_AUD, both of
        # which are non-secret vars in wrangler.jsonc).
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.jsonc
          wranglerVersion: ${{ env.WRANGLER_VERSION }}

      - name: Smoke test deployment
        # Sprint 2a (A4): hitting /admin in prod returns 302 to Cloudflare
        # Access (login challenge). Accept 200/302 so this step doesn't
        # break the day the deploy succeeds. validate:prod (run separately
        # via npm run validate:prod) does the deeper Access-aware checks.
        run: |
          URL="https://link.mackhaymond.co"
          curl -fsS -o /dev/null "$URL/"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/admin")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "Unexpected /admin status: $STATUS"
            exit 1
          fi
        shell: bash
