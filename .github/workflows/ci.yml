name: CI and Deploy

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  WRANGLER_VERSION: '4'

jobs:
  validate:
    name: Validate (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: |
          cat > admin/.env.local << EOL
          VITE_API_BASE=http://localhost:8787
          VITE_WORKER_DOMAIN=localhost:8787
          VITE_GITHUB_CLIENT_ID=test_client_id
          EOL
          npm run build

      - name: Check bundle size
        run: npm run check:bundle-size

  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://link.mackhaymond.co
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build worker with embedded admin
        run: |
          cat > admin/.env.production << EOL
          VITE_API_BASE=https://link.mackhaymond.co
          VITE_WORKER_DOMAIN=link.mackhaymond.co
          VITE_GITHUB_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}
          EOL
          npm run build

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations list mack-link --remote
          wranglerVersion: ${{ env.WRANGLER_VERSION }}

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.jsonc
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}

      - name: Smoke test deployment
        run: |
          URL="https://link.mackhaymond.co"
          curl -fsS -o /dev/null "$URL/"
          curl -fsS -o /dev/null "$URL/admin"
        shell: bash
